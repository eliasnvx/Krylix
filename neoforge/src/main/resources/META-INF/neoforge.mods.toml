modLoader = "javafml"

loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/eliasnvx/Krylix/issues"

[[mods]]
modId = "krylix"
version = "${version}"
displayName = "Krylix"
authors = "eliasnvx"
description = '''
A modern kill feed, mob-kill tracker, crosshair health indicator, and player leaderboard for Minecraft NeoForge, with a full configuration GUI and localization into 13 languages.
'''
updateJSONURL="https://raw.githubusercontent.com/eliasnvx/Krylix/26.1-dev/updates.json"
logoFile="icon.png"

[[dependencies.krylix]]
modId = "neoforge"
type = "required"
versionRange = "[26.1.2.95,26.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.krylix]]
modId = "minecraft"
type = "required"
# A 26.1 jar must not try to load on 26.2+: the rendering and input APIs it uses are gone there
versionRange = "[26.1,26.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.krylix]]
modId = "cloth_config"
type = "required"
versionRange = "[26.1,)"
ordering = "NONE"
side = "BOTH"

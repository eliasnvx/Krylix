modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/eliasnvx/Krylix/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "eliasnvx"
description = '''
A kill feed, health plates over whatever you aim at, per-player mob stats and an all-time PvP leaderboard, with a public API for addons.
'''
iconFile = "icon.png"
displayURL = "https://modrinth.com/mod/krylix"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
# One jar per Minecraft version: rendering and input APIs change between them
versionRange = "[${minecraft_version},26.4)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "cloth_config"
type = "required"
versionRange = "[${cloth_config_version},)"
ordering = "NONE"
side = "BOTH"

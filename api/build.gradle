// Public API for addons: interfaces, records and events. Depends on vanilla Minecraft only — never on :common.
architectury {
    common(rootProject.platforms.split(","))
}

version = rootProject.api_version

dependencies {
    // Addons compile against these annotations (@ApiStatus); exported as compile-only
    compileOnlyApi "org.jetbrains:annotations:${rootProject.jetbrains_annotations_version}"
}

java {
    withJavadocJar()
}

javadoc {
    options.encoding = "UTF-8"
    options.addBooleanOption("Xdoclint:all,-missing", true)
}

java {
    withSourcesJar()
}

// A plain jar name, so Maven (pom-only) consumers find it too; Loom would call it "-dev"
jar {
    archiveClassifier = ""
}

// API jar for addon authors: com.eliasnvx:krylix-api:<api_version>+<mc>.
// The repository comes from the environment (release workflow); locally: ./gradlew :api:publishToMavenLocal
apply plugin: "maven-publish"

publishing {
    publications {
        mavenApi(MavenPublication) {
            groupId = rootProject.maven_group
            artifactId = "${rootProject.archives_base_name}-api"
            version = "${rootProject.api_version}+${rootProject.minecraft_version}"
            from components.java
            pom {
                name = "Krylix API"
                description = "Public API for Krylix addons"
                url = "https://github.com/eliasnvx/Krylix"
                licenses {
                    license {
                        name = "MIT"
                        url = "https://opensource.org/licenses/MIT"
                    }
                }
                developers {
                    developer {
                        id = "eliasnvx"
                        name = "eliasnvx"
                    }
                }
            }
        }
    }
    repositories {
        def mavenUrl = providers.environmentVariable("KRYLIX_MAVEN_URL").orNull
        if (mavenUrl != null) {
            maven {
                name = "release"
                url = mavenUrl
                credentials {
                    username = providers.environmentVariable("KRYLIX_MAVEN_USER").orNull
                    password = providers.environmentVariable("KRYLIX_MAVEN_PASSWORD").orNull
                }
            }
        }
    }
}

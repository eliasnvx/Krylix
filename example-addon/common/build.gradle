// Example addon (common). Depends ONLY on the public API: it is the API's regression check. Never published.
architectury {
    common(rootProject.platforms.split(","))
}

dependencies {
    compileOnly "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation project(":api")
}

tasks.matching { it.name.startsWith("transformProduction") }.configureEach { dependsOn(":api:jar") }

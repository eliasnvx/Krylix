org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true

# Gradle's HTTP resource resolution has no timeout by default: on a flaky network (e.g. some VPNs) a stalled
# repository hangs the build forever instead of failing with a clear host name.
systemProp.java.net.preferIPv4Stack=true
systemProp.http.connectionTimeout=30000
systemProp.http.socketTimeout=30000
systemProp.https.connectionTimeout=30000
systemProp.https.socketTimeout=30000

# Mod
mod_id=krylix
mod_name=Krylix
mod_version=1.4.0
maven_group=com.eliasnvx
archives_base_name=krylix
# Public API SemVer, independent of mod_version
api_version=1.0.0

platforms=fabric,neoforge

# Minecraft and loaders (checked against maven-metadata on 2026-09-29)
minecraft_version=26.3
fabric_loader_version=0.19.5
fabric_api_version=0.161.0+26.3
neoforge_version=26.3.0.33-beta
cloth_config_version=26.3.158
modmenu_version=21.0.0
jetbrains_annotations_version=26.1.0
junit_version=6.1.3

org.gradle.jvmargs=-Xmx4000m
org.gradle.java.home=/Users/elias/jdks/jdk-25.0.4+7/Contents/Home
fabric.loom.disableObfuscation=true
# ForgeGradle's UserDevPlugin does a blocking HTTPS reachability check against
# maven.minecraftforge.net/libraries.minecraft.net with no read timeout. On networks where
# that connection stalls (e.g. some VPNs), the build hangs indefinitely instead of failing.
systemProp.net.minecraftforge.gradle.check.certs=false
systemProp.java.net.preferIPv4Stack=true

# Gradle's own HTTP resource resolution has no timeout by default either — if a repository host
# is unreachable (flaky VPN routing), the build hangs forever instead of failing with a clear
# "which host" error. Force a bounded timeout so failures are fast and diagnosable.
systemProp.http.connectionTimeout=30000
systemProp.http.socketTimeout=30000
systemProp.https.connectionTimeout=30000
systemProp.https.socketTimeout=30000

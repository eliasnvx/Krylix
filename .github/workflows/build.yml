name: 🔨 Build

on:
  pull_request:
    branches: [ 'main', 'dev' ]
  push:
    branches: [ 'main', 'dev' ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'MODRINTH.md'
      - 'ICON_INFO.md'

jobs:
  build-forge:
    name: 🏗️ Build Forge
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: ✅ Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3
      
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: 🗂️ Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: 🧹 Cleanup Gradle cache
        run: |
          rm -f ~/.gradle/caches/modules-2/modules-2.lock
          rm -f ~/.gradle/caches/modules-2/gc.properties
      
      - name: 🔧 Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: 🏗️ Build Forge with Gradle
        run: ./gradlew :forge:build -x ktlintMainSourceSetCheck -x ktlintTestSourceSetCheck --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx3G"
      
      - name: 📊 Upload Forge artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Krylix-Forge-${{ github.sha }}
          path: forge/build/libs/*.jar
          retention-days: 30
      
      - name: 📝 Build summary
        if: success()
        run: |
          echo "### ✅ Forge Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Forge artifacts uploaded successfully!" >> $GITHUB_STEP_SUMMARY

  build-fabric:
    name: 🏗️ Build Fabric
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: ✅ Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3
      
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: 🗂️ Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: 🧹 Cleanup Gradle cache
        run: |
          rm -f ~/.gradle/caches/modules-2/modules-2.lock
          rm -f ~/.gradle/caches/modules-2/gc.properties
      
      - name: 🔧 Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: 🏗️ Build Fabric with Gradle
        run: ./gradlew :fabric:build -x ktlintMainSourceSetCheck -x ktlintTestSourceSetCheck --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx3G"
      
      - name: 📊 Upload Fabric artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Krylix-Fabric-${{ github.sha }}
          path: fabric/build/libs/*.jar
          retention-days: 30
      
      - name: 📝 Build summary
        if: success()
        run: |
          echo "### ✅ Fabric Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Fabric artifacts uploaded successfully!" >> $GITHUB_STEP_SUMMARY

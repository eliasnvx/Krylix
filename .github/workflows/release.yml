name: 🚀 Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-forge'
      - 'v*.*.*-fabric'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string
      platform:
        description: 'Platform to release'
        required: true
        type: choice
        options:
          - forge
          - fabric
          - both

jobs:
  release-forge:
    name: 📦 Release Forge
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && (contains(github.ref, '-forge') || !contains(github.ref, '-fabric'))) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'forge' || github.event.inputs.platform == 'both'))
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: ✅ Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3
      
      - name: 🔧 Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: 🏗️ Build Forge with Gradle
        run: ./gradlew :forge:build -x ktlintMainSourceSetCheck -x ktlintTestSourceSetCheck --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx3G"
      
      - name: 📝 Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=${GITHUB_REF#refs/tags/v}
            VERSION=${VERSION%-forge}
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          fi
      
      - name: 📋 Generate changelog
        id: changelog
        run: |
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          if [ -f CHANGELOG.md ]; then
            sed -n '/^## \[${{ steps.version.outputs.VERSION }}\]/,/^## \[/p' CHANGELOG.md | sed '$d' >> $GITHUB_OUTPUT
          else
            echo "Release ${{ steps.version.outputs.VERSION }}" >> $GITHUB_OUTPUT
          fi
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: 🎉 Create GitHub Release (Forge)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}-forge
          name: Krylix Forge v${{ steps.version.outputs.VERSION }}
          body: |
            ## 🎮 Krylix Forge v${{ steps.version.outputs.VERSION }}
            
            ${{ steps.changelog.outputs.CHANGELOG }}
            
            ---
            
            ### 📥 Downloads
            - Download the JAR file below
            - Requires Minecraft 1.20.1 + Forge 47.1.0+
            - Requires KotlinForForge 4.3.0 (bundled)
            
            ### 🔗 Links
            - [CurseForge](https://curseforge.com/minecraft/mc-mods/krylix)
            - [Modrinth](https://modrinth.com/mod/krylix)
            - [GitHub](https://github.com/eliasnvx/Krylix)
          files: forge/build/libs/*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: ✅ Release summary
        run: |
          echo "### 🎉 Forge Release v${{ steps.version.outputs.VERSION }} Published!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** Forge" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`v${{ steps.version.outputs.VERSION }}-forge\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View Release](https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.VERSION }}-forge)" >> $GITHUB_STEP_SUMMARY

  release-fabric:
    name: 📦 Release Fabric
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && contains(github.ref, '-fabric')) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'fabric' || github.event.inputs.platform == 'both'))
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: ✅ Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3
      
      - name: 🔧 Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: 🏗️ Build Fabric with Gradle
        run: ./gradlew :fabric:build -x ktlintMainSourceSetCheck -x ktlintTestSourceSetCheck --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx3G"
      
      - name: 📝 Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=${GITHUB_REF#refs/tags/v}
            VERSION=${VERSION%-fabric}
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          fi
      
      - name: 📋 Generate changelog
        id: changelog
        run: |
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          if [ -f CHANGELOG.md ]; then
            sed -n '/^## \[${{ steps.version.outputs.VERSION }}\]/,/^## \[/p' CHANGELOG.md | sed '$d' >> $GITHUB_OUTPUT
          else
            echo "Release ${{ steps.version.outputs.VERSION }}" >> $GITHUB_OUTPUT
          fi
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: 🎉 Create GitHub Release (Fabric)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}-fabric
          name: Krylix Fabric v${{ steps.version.outputs.VERSION }}
          body: |
            ## 🎮 Krylix Fabric v${{ steps.version.outputs.VERSION }}
            
            ${{ steps.changelog.outputs.CHANGELOG }}
            
            ---
            
            ### 📥 Downloads
            - Download the JAR file below
            - Requires Minecraft 1.20.1 + Fabric Loader 0.14.0+
            - Requires Fabric API and Fabric Language Kotlin
            
            ### 🔗 Links
            - [CurseForge](https://curseforge.com/minecraft/mc-mods/krylix)
            - [Modrinth](https://modrinth.com/mod/krylix)
            - [GitHub](https://github.com/eliasnvx/Krylix)
          files: fabric/build/libs/*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: ✅ Release summary
        run: |
          echo "### 🎉 Fabric Release v${{ steps.version.outputs.VERSION }} Published!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** Fabric" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`v${{ steps.version.outputs.VERSION }}-fabric\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View Release](https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.VERSION }}-fabric)" >> $GITHUB_STEP_SUMMARY
